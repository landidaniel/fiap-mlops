name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: aula08

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: pip
          cache-dependency-path: aula08/requirements.txt

      - name: Instalar ferramentas de qualidade
        run: pip install flake8 black

      - name: Lint com flake8
        run: flake8 src tests

      - name: Verificar formatação com black
        run: black --check src tests

  test:
    runs-on: ubuntu-latest
    needs: lint
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.10', '3.11']

    defaults:
      run:
        working-directory: aula08

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: aula08/requirements.txt

      - name: Instalar dependências
        run: |
          pip install -r requirements.txt
          pip install pytest-cov

      - name: Executar testes com cobertura
        run: pytest tests/ -v --cov=src --cov-report=xml --cov-report=term

      - name: Upload coverage
        if: matrix.python-version == '3.10'
        uses: codecov/codecov-action@v3
        with:
          file: aula08/coverage.xml
          fail_ci_if_error: false

  train-and-validate:
    runs-on: ubuntu-latest
    needs: test

    defaults:
      run:
        working-directory: aula08

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: pip
          cache-dependency-path: aula08/requirements.txt

      - name: Instalar dependências
        run: pip install -r requirements.txt

      - name: Treinar modelo
        run: python src/train/train.py

      - name: Validar acurácia
        run: python src/train/validate_model.py

      - name: Upload do modelo treinado
        uses: actions/upload-artifact@v4
        with:
          name: trained-model
          path: aula08/models/model.pkl
          retention-days: 7
