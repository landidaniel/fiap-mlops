apiVersion: apps/v1
kind: Deployment
metadata:
  name: iris-api-blue
  labels:
    app: iris-api
    version: blue
spec:
  replicas: 1
  selector:
    matchLabels:
      app: iris-api
      version: blue
  template:
    metadata:
      labels:
        app: iris-api
        version: blue
    spec:
      containers:
        - name: iris-api
          image: fiap-ml-iris:1.0.0
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 5001
          env:
            - name: APP_VERSION
              value: "blue-1.0.0"
          readinessProbe:
            httpGet:
              path: /ready
              port: 5001
            initialDelaySeconds: 3
            periodSeconds: 5
